[tool.poetry]
name = "galaxywizard"
version = "0.1.0"
description = "GalaxyWizard is an open-source tactical RPG written with python"
authors = ["jeremy jeanne <jyjeanne@gmail.com>"]
license = "GPL-2.0 license"
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.scripts]
galaxywizard = "src.main:main"
galaxywizard-build = "build_scripts:build_exe"

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
numpy = "==1.24.1"
PyOpenGL = "==3.1.7"
pygame = "^2.5.2"
Twisted = "^24.3.0"
PyOpenGL_accelerate = "==3.1.7"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
pyinstaller = "^6.3.0"
ruff = "^0.15.8"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E4",  # imports
    "E7",  # statements
    "E9",  # runtime errors
    "F",   # pyflakes
    "W",   # warnings
]

[tool.ruff.lint.per-file-ignores]
# Game data files are DSL scripts executed via exec() with names
# (Damage, Status, ACTION, _, ...) injected into their namespace by
# src/resources.py, so undefined-name checks do not apply.
"src/data/**" = ["F821", "W291", "W293"]
"src/test/data/**" = ["F821", "W291", "W293"]
# OpenGL rendering code uses the conventional `from OpenGL.GL import *`
# idiom; explicit imports of hundreds of gl* symbols are impractical.
"src/engine/Map.py" = ["F403", "F405"]
"src/gui/**" = ["F403", "F405"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"